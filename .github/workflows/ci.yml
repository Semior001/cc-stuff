name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate JSON manifests
        run: |
          find . -name '*.json' -path '*.claude-plugin*' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null

      - name: Validate YAML frontmatter in markdown files
        run: python3 .github/scripts/check-frontmatter.py .

      - name: ShellCheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck

      - name: Run shell tests
        run: |
          shopt -s nullglob
          for t in tests/test-*.sh; do bash "$t"; done

      - name: Run python tests
        run: |
          python3 .github/scripts/check-frontmatter.py --test
